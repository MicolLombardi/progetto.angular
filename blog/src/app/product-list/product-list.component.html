<!-- Widget del carrello -->
<div *ngIf="showCartWidget" class="cart-widget">
  <p>🛒 {{ totalItemsInCart }} prodotti nel carrello</p>
  <p><strong>Aggiunto:</strong> {{ lastAddedProducts[0].name }}</p>

  <div *ngIf="lastAddedProducts.length > 1">
    <p><strong>Ultimi aggiunti:</strong></p>
    <ul>
      <li *ngFor="let product of lastAddedProducts.slice(1, 3)">
        {{ product.name }}
      </li>
    </ul>
  </div>
</div>
<div *ngFor="let product of products" class="product">
  <h3>{{ product.name }}</h3>
  <p>Prezzo: {{ product.price | currency }}</p>

  <div class="quantity-controls">
    <button (click)="decreaseQuantity(product)" [disabled]="quantities[product.id] === 0">-</button>
    <span>{{ quantities[product.id] || 0 }}</span>
    <button (click)="increaseQuantity(product)">+</button>
  </div>
</div>
